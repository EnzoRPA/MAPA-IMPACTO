<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var getFetch = function() { return currentFetch; };
          var setFetch = function(val) { currentFetch = val; };

          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: getFetch,
              set: setFetch
            });
          } catch (err1) {}

          try {
            var proto = Object.getPrototypeOf(window) || (window.constructor && window.constructor.prototype);
            if (proto) {
              Object.defineProperty(proto, 'fetch', {
                configurable: true,
                enumerable: true,
                get: getFetch,
                set: setFetch
              });
            }
          } catch (err2) {}
        } catch (e) {}

        // Suppress benign chrome-extension noise from bubbling to parent window
        window.addEventListener('error', function(event) {
          if (event.filename && event.filename.includes('chrome-extension://')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
    <title>Mapeamento Missionário - Rotas & Territórios</title>
    <meta name="description" content="Sistema de mapeamento territorial e roteamento para duplas missionárias, com traçado de ruas, estimativa de residências e exportação em JPG e PDF." />
